{% extends 'base.html' %}

{% block title %}Додати новий товар{% endblock %}

{% block content %}
<h2>Додавання нового товару</h2>

<form method="post" style="max-width: 400px; display: flex; flex-direction: column; gap: 10px;">
    {% csrf_token %}
    
    <label>Назва товару:
        <input type="text" name="name" required style="width: 100%; padding: 8px;">
    </label>

    <label>Бренд:
        <input type="text" name="brand" required style="width: 100%; padding: 8px;">
    </label>

    <label>Розмір:
        <input type="text" name="size" required style="width: 100%; padding: 8px;">
    </label>

    <label>Колір:
        <input type="text" name="color" required style="width: 100%; padding: 8px;">
    </label>

    <label>Ціна (грн):
        <input type="number" step="0.01" name="price" required style="width: 100%; padding: 8px;">
    </label>

    <button type="submit" style="padding: 10px; background-color: #28a745; color: white; border: none; cursor: pointer; border-radius: 4px;">Зберегти товар</button>
</form>
{% endblock %}
